services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketpulse}
      POSTGRES_DB: marketpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      MP_DATA_PROVIDER: ${MP_DATA_PROVIDER:-mock}
      MP_STORAGE: postgres
      MP_DATABASE_URL: postgresql+psycopg://marketpulse:${POSTGRES_PASSWORD:-marketpulse}@db:5432/marketpulse
      MP_CORS_ORIGINS: '["http://localhost:3000"]'
      MP_ADMIN_TOKEN: ${MP_ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    build: ./backend
    command: ["python", "-m", "app.cli", "worker"]
    environment:
      <<: *backend-env
      MP_AUTO_SEED: "false"
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 30s

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
